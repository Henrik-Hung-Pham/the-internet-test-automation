name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR) to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Robocop
        run: |
          python -m pip install --upgrade pip
          pip install robotframework-robocop==8.2.4

      - name: Lint (Robocop)
        run: robocop check .

  e2e:
    name: E2E — ${{ matrix.browser-label }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            browser-label: Chromium Browsers
            webkit: false
            exclude-tags: --exclude firefox --exclude webkit
          - browser: firefox
            browser-label: Firefox
            webkit: false
            exclude-tags: --exclude chromium --exclude webkit
          - browser: webkit
            browser-label: WebKit Browsers
            webkit: true
            exclude-tags: --exclude chromium --exclude firefox

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          rfbrowser init

      - name: Install WebKit System Dependencies
        if: matrix.webkit == true
        run: |
          node $(python -c "import Browser, os; print(os.path.join(os.path.dirname(Browser.__file__), 'wrapper', 'node_modules', '.bin', 'playwright'))") install-deps webkit

      - name: Run Tests — ${{ matrix.browser-label }}
        run: |
          pabot --testlevelsplit \
            --listener allure_robotframework:results/allure \
            -d results \
            --variablefile resources/environments/prod.yaml \
            --variable HEADLESS:True \
            --variable BROWSER:${{ matrix.browser }} \
            ${{ matrix.exclude-tags }} \
            tests/

      - name: Print Failed Tests
        if: failure()
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('results/output.xml')
          printed = 0
          for test in tree.getroot().iter('test'):
              s = test.find('status')
              if s is None or s.get('status') != 'FAIL':
                  continue
              print(f'FAIL: {test.get(\"name\")}')
              if s.text:
                  print(f'  STATUS: {s.text[:500]}')
              for m in test.iter('msg'):
                  lvl = m.get('level', '')
                  if lvl in ('FAIL', 'ERROR', 'WARN') and m.text:
                      print(f'  [{lvl}] {m.text[:500]}')
              print()
              printed += 1
              if printed >= 5:
                  print(f'... (showing first 5 failures only)')
                  break
          "

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: robot-report-${{ matrix.browser }}
          path: results/
